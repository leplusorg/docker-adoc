---
name: Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  action-test:
    name: Test the GitHub Action
    runs-on: ubuntu-latest
    permissions:
      # Required to clone the repo so the local action can be used.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Create a sample AsciiDoc file
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          printf '= Hello\n\nWorld from *AsciiDoc*.\n' > input.adoc
      - name: Convert the file with the action
        uses: ./
        with:
          args: asciidoctor -o output.html input.adoc
      - name: Check that the output was produced
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          test -s output.html
          grep -q "World from" output.html
